[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astraljet"
version = "0.1.0"
description = "Bezpieczny, lokalny rdzeń badawczy i wykonawczy Astra JET"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
astraljet = "astraljet.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
